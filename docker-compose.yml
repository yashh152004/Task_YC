services:
  # Local PostgreSQL Database
  postgres:
    image: postgres:14-bookworm
    container_name: loan_postgres
    restart: always
    environment:
      POSTGRES_DB: loan_matcher_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize database schema and seed data on startup
      - ./schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_matcher_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # n8n Automation Engine
  n8n:
    image: n8nio/n8n:1.100.1
    container_name: loan_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - NODE_FUNCTION_ALLOW_BUILTIN=*
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount project data folder so n8n can read backup_loans.json
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
